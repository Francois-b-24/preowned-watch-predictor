[project]
name = "preowned-watch-predictor"
version = "0.1.0"
requires-python = ">=3.10"
description = "Price prediction for pre-owned luxury watches"
authors = [{name = "Your Name"}]
readme = "README.md"
dependencies = [
  "pandas",
  "numpy",
  "scikit-learn",
  "category-encoders",
  "optuna",
  "shap",
  "matplotlib",
  "pyyaml",
  "mlflow",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E","F","I"]
