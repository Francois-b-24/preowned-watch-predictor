[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "preowned-watch-predictor"
version = "0.1.0"
description = "Price prediction for pre-owned luxury watches"
readme = "README.md"
authors = ["BOUSSENGUI François <you@example.com>"]
license = "MIT"
keywords = ["ml", "regression", "watches", "price-prediction"]
# Package the 'src' directory as a package named 'src' (current code imports from 'src.*')
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.10"
pandas = ">=2.0"
numpy = ">=1.24"
scikit-learn = ">=1.2,<2.0"
category-encoders = ">=2.6"
optuna = ">=3"
shap = ">=0.44"
matplotlib = ">=3.7"
pyyaml = ">=6.0"
mlflow = ">=2.5"
streamlit = ">=1.25"
openpyxl = ">=3.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4"
pytest-cov = ">=4.1"
black = ">=23.7"
ruff = ">=0.3.0"
mypy = ">=1.5"
ipykernel = ">=6.25"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP", "B"]
ignore = ["E203"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
profile = "black"

[tool.poetry.scripts]
run-pipeline = "src.run_pipeline:main"
run-app = "streamlit.web.cli:main"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
